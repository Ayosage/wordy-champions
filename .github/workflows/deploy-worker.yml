name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy \
            --var APP_VERSION:${GITHUB_SHA::7} \
            --var CLIENT_ORIGIN:https://wordy-client.vercel.app
      - name: Verify
        # the edge can serve the previous version for a short while after a deploy
        run: |
          for i in $(seq 1 12); do
            body=$(curl -sf https://wordy.aexbrandon.workers.dev/healthz || true)
            echo "$body"
            if echo "$body" | grep -q "\"version\":\"${GITHUB_SHA::7}\""; then exit 0; fi
            sleep 5
          done
          echo "healthz never reported ${GITHUB_SHA::7}"
          exit 1
